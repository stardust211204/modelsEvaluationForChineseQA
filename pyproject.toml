[project]
name = "meval"
version = "0.1.0"
description = "大模型准确性评测管线（HELM 范式，适配封闭 API + 推理模型环境）"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "datasets>=2.20",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# 说明：本项目不通过 pip 安装自身。
# scripts/ 与 tests/ 均显式把 src/ 加入 sys.path（见各文件顶部的 sys.path.insert），
# 因此无需 editable install —— 少一层构建依赖，少一处出错点。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
