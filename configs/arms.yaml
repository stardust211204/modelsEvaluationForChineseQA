# 三个模型定义
#
# ★ 纪律：params 是「该模型实测生效后」冻结的字典，不是全局一套。
#   实测已证明参数跨厂商不可约（见 docs/param_matrix.md §5）。
#
# 已由 scripts/probe_arms.py 于 2026-10-03 逐模型探测并回填（39 次调用）。
# 探测结论：
#   * 三个模型温度**全部失效**（temp=1.0 同题 6 次仅 1 种输出）
#   * 关思考参数各不相同：LongCat 用 thinking，MiMo/DeepSeek 用 reasoning_effort
#   * max_tokens 下限 512 即够；此处取 1024 为隐含思考留余量
#     ★ 2026-10-10 更正（E1 实测，1,500 次调用）：**1024 只在思考关闭时才够**。
#       开思考后 ds-pro / ds-flash 分别有 37% / 32% 的回复撞上 1024 被截断
#       （`finish_reason=length`、content 为空），提到 8192 仍有 9~14 条。
#       另：qwen3.8-flash 的思考 token **不占** max_tokens（实测 reasoning 达 5131
#       仍 `finish_reason=stop`）⇒ **同一个 max_tokens 对不同模型含义不同**。
#   * ★ 厂商私有参数必须走 extra_body —— 直传 kwarg 会在本地抛 TypeError

base_url: "https://opencode.ai/zen/go/v1"

# 请求层的公共默认值（可被单个模型覆盖）
defaults:
  max_tokens: 1024
  # ★ 2026-10-10 修：这两个键原先被 `adapt.load_arms()` 从 params 里 `pop` 出来
  #   **直接丢弃** ⇒ 它们一直是摆设，改了没有任何效果（实际生效的只是
  #   `client.py` 的同值默认）。现在随 `Arm` 传递，由 run_config / run_specs 真正用上。
  #   `run_config.py --timeout` 可对单次跑批覆盖模型级值。
  timeout_s: 120
  max_retries: 4

arms:

  - name: "longcat-2.5-preview-free"
    vendor: "美团 LongCat"
    model: "longcat-2.5-preview-free"
    concurrency: 4           # preview/free 档，并发保守
    params:
      max_tokens: 1024
      temperature: 0.1
      thinking: {type: "disabled"}      # 实测：本模型只认这个关思考参数
    temp_effective: false               # 实测：温度被忽略
    risk: "preview + free 档：可能限流、可能随时变更或下线"

  - name: "mimo-v2.6-flash"
    vendor: "小米 MiMo"
    model: "mimo-v2.6-flash"
    concurrency: 4
    params:
      max_tokens: 1024
      temperature: 0.1
      reasoning_effort: "none"          # 实测：reasoning_len 归零
    temp_effective: false
    risk: "免费档，限流未知"

  - name: "deepseek-v4.1-flash"
    vendor: "DeepSeek"
    model: "deepseek-v4.1-flash"       # 注：与 deepseek-flash 同一模型（别名）
    concurrency: 8
    params:
      max_tokens: 1024
      temperature: 0.1
      reasoning_effort: "none"          # 实测：reasoning_len 归零
    temp_effective: false
    risk: "—"

  # ★ 第 4 个模型（2026-10-04 加入）。探测记录 data/raw_evidence/probe_new_arm_qwen3.8-flash.jsonl
  #
  # 选它的理由：现有三个模型全是 flash/free 档，本模型**同档** ⇒ 四个模型在同一层，档位不混淆。
  # 未选 qwen3.8-max：那是旗舰档，混进来会让"谁更强"被"谁更贵"解释掉。
  #
  # ★★ 本模型是本项目**第一个温度真正生效**的模型（6 次 @temp=1.0 得到 6 种不同输出）。
  #    现有三个模型温度全部失效（见 probe_arms 结论），所以 C3 只能说
  #    「temperature 被忽略 ≠ 输出可复现」。有了本模型，**温度这条轴第一次可直接测** ——
  #    同题 temp=0.1 vs 1.0 的对照，能回答"可复现性到底由什么决定"。
  - name: "qwen3.8-flash"
    vendor: "阿里 Qwen"
    model: "qwen3.8-flash"
    concurrency: 4
    params:
      max_tokens: 1024
      temperature: 0.1
      reasoning_effort: "none"          # 实测：reasoning 327 → 0
    temp_effective: true                # ★ 实测：6/6 输出不同（唯一生效的模型）
    risk: "未知，需观察限流；max_tokens 低于 1024 会被截断（512 实测 finish=length）"

  # ---------------------------------------------------------------------------
  # ★ 第 5 个模型：旗舰档参照（2026-10-05 加）
  # ---------------------------------------------------------------------------
  # 定位与其余四个模型**不同**：它不是"再比一个 flash"，而是给四个模型提供一个**档位参照**，
  # 回答"升级到旗舰档，多出来的能力值不值"。所以它**不参与 flash 之间的排名**，
  # 只作为一条水平参考线出现在报告里。
  #
  # ★ 为什么走**官方端点**而不是聚合端点
  #   聚合端点上该模型额度少、性价比低（用户 2026-10-05 确认）。
  #   但这样一来，本模型的**接入方式与其余四个模型不同** —— 这是"模型"与"接入方式"
  #   同时变化，违反单因子纪律。缓解与残余风险：
  #     * 已有证据：`runs/endpoint-cmp` 实测 官方 deepseek-flash ≈ 聚合
  #       deepseek-v4.1-flash（96/100 token 完全一致）⇒ 两端点对 DeepSeek 家族基本同源
  #     * **残余风险**：那只验证了 flash 档，**v4-pro 的端点一致性未验证**。
  #       报告中必须显式声明；任何"旗舰更强"的结论都要带着这个前提读。
  #
  # ★ 关思考参数与三个模型一致（reasoning_effort=none）
  #   不加这一条会重演"参数悄悄漂移"：思考开着会吃掉 token 预算，
  #   在小 max_tokens 下返回空 content 而 HTTP=200 —— 静默失败。
  - name: "deepseek-v4-pro"
    vendor: "DeepSeek（旗舰档）"
    model: "deepseek-v4-pro"
    # 官方端点（与 judge 同源，但用途不同：judge 是判卷，本模型是**被评测**）
    base_url: "https://api.deepseek.com"
    key_env: "DEEPSEEK_API_KEY"
    concurrency: 4                      # 官方端点保守起步，观察限流
    params:
      max_tokens: 1024
      temperature: 0.1
      reasoning_effort: "none"
    risk: "★ 接入方式与其余四个模型不同（官方 vs 聚合）；端点一致性仅用 flash 档验证过"

  # ---------------------------------------------------------------------------
  # ★ 第 6 个模型：代号模型（2026-10-05 加，**限时窗口**）
  # ---------------------------------------------------------------------------
  # ★★ 为什么明知"不宜写进简历"还是采数据
  #   它在聚合端点上**开放测试，用户告知约 5 小时后截止**。这类窗口是"用完即失"：
  #   采集成本很低（C1 两题库 ≈ 1,171 次），而窗口关闭后**永远拿不到**。
  #   采数据 ≠ 写进简历 —— 结论照旧不进正式排名，但数据留下。
  #   它与 `longcat-2.5-preview-free` 同属"发布前预览"，正好强化"抢先评测"这条线。
  #
  # ★ 探测结论（2026-10-05，8 次调用）
  #   * 它是**推理模型**，且 **`reasoning_effort` 被 400 拒绝**（与其余模型的参数不通用）
  #   * 试过 5 种关思考写法，**没有一种能真正关掉**：
  #       thinking=disabled          -> 400
  #       enable_thinking=False      -> 接受，但 reasoning 仍有 2508 字符
  #       chat_template_kwargs       -> 接受，reasoning 831 字符 ← **本模型采用，最优**
  #       reasoning.enabled=False    -> 接受，reasoning 961 字符
  #       thinking_budget=0          -> 接受，reasoning 3405 字符
  #   * 默认配置下小 max_tokens 会**思考吃满预算、HTTP 200 但 content 为空**
  #     （实测 prox-zh-73 在 1024 下 content=''）⇒ 必须给足预算
  #
  # ⚠️ 因此本模型与其余五个模型**不可严格同口径**：它在思考，其余模型的思考都被关掉了。
  #    报告里只能作为**旁证/观察**，不进正式排名；成本按**实际 token** 计算（口径一致）。
  - name: "space-bunny-free"
    vendor: "未知（代号模型，厂商未公开）"
    model: "space-bunny-free"
    concurrency: 4
    params:
      max_tokens: 4096                    # ★ 关不掉思考，必须给足预算
      temperature: 0.1
      chat_template_kwargs: {enable_thinking: false}   # 探测到的最优写法（仍非完全关闭）
    risk: "★ 厂商未知；★ 无法关闭思考（与其余五个模型口径不同）；★ 限时窗口，可能随时下线"

# ---------------------------------------------------------------------------
# 已排除的模型（记录理由，避免日后重复踩坑）
# ---------------------------------------------------------------------------
excluded:

  - model: "deepseek-flash"
    reason: "与 deepseek-v4.1-flash 指向同一模型（官方确认），同时选会产出伪代际对照"

  - model: "deepseek-v4-flash"
    reason: "旧名，模型已下线，请求被路由到 DeepSeek-V4.1-Flash"

  - model: "deepseek-v4-flash-vision-exp"
    reason: "官方标注已下线，同样被路由"

  - model: "gpt-5.6-luna / gpt-6-luna / omen-alpha / space-bunny-free"
    reason: "代号未知厂商归属，不宜写进简历"

# ---------------------------------------------------------------------------
# 选模型后必须做的两项检查（见 docs/param_matrix.md §8）
# ---------------------------------------------------------------------------
checks:
  - "该模型是否内置思考、能否关闭、用哪个参数关 —— 关不掉会在小 max_tokens 下返回空 content（HTTP 200）"
  - "Free / Preview 档是否限流、是否会在跑批中途变更 —— 中途换后端 = 数据不可比"
  - "三个模型互异性行为指纹：30–40 题答案完全一致率须 < 80%（且先剔除空响应）"

# ---------------------------------------------------------------------------
# ★ 加模型的代价（2026-10-04 加第 4 个模型时确认）
# ---------------------------------------------------------------------------
# 配对键是 (config, arm, instance_id, rep)，所以**新模型无法回溯**进已有 run ——
# c1-full / c2-full / c3-full / c4-full2 / c5-full2 / c6-full / c7-full3 全部是 3 个模型。
#
# 因此新模型的比较必须在**一个新的、包含全部模型的 run** 内部完成：
#   scripts/run_config.py --config c1 --run-id c1-4arm        # 4 × 588 = 2,352 次
# 旧 run 保持冻结不动（所有已发布结论引用的是它们）。
#
# 附带收益：新 run 里有 3 个重叠模型 ⇒ 可测**跨 run 复现性**。
# 我们此前只有 C3 的 **run 内**重复噪声（同一 run 里同题跑 10 次），
# **没有跨 run 的**（同配置重跑一次，结论还一样吗）—— 那是个真空白。
#
# 行为指纹不必单独跑：四个模型 C1 的 588 题逐题答案一致率足以判定别名。
